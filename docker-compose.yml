services:
  db:
    image: mariadb:11.4.13
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "${WORDPRESS_HOST_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      # Default skip keeps `make up` usable when siteurl is localhost:8080 (PHP cannot fetch that).
      # `make e2e` / `make e2e-full` set E2E_SKIP_PUBLIC_URL=0 and WP_INTERNAL_URL=http://wordpress.
      E2E_SKIP_PUBLIC_URL: ${E2E_SKIP_PUBLIC_URL:-1}
      WORDPRESS_CONFIG_EXTRA: ${WORDPRESS_CONFIG_EXTRA:-}
    volumes:
      - wordpress-data:/var/www/html
      - ./packages/wordpress-plugin:/var/www/html/wp-content/plugins/wordpress-chatgpt
      - ./docker/wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    depends_on:
      db:
        condition: service_healthy

  wp-init:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WP_DEV_TOKEN: ${WORDPRESS_CONNECTION_TOKEN:-dev-wp-token-local-only}
      WP_INTERNAL_URL: ${WP_INTERNAL_URL:-http://localhost:8080}
      DISABLE_WP_CRON: ${DISABLE_WP_CRON:-}
    volumes:
      - wordpress-data:/var/www/html
      - ./packages/wordpress-plugin:/var/www/html/wp-content/plugins/wordpress-chatgpt
      - ./docker/wordpress/init:/init:ro
    entrypoint: ["/bin/sh", "/init/setup.sh"]
    depends_on:
      - wordpress
    restart: "no"

  mcp:
    build:
      context: ./packages/mcp-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      WORDPRESS_URL: http://wordpress
      WORDPRESS_CONNECTION_TOKEN: ${WORDPRESS_CONNECTION_TOKEN:-dev-wp-token-local-only}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-static}
      MCP_AUTH_SECRET: ${MCP_AUTH_SECRET:-dev-mcp-secret-local-only}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3000}
      MCP_PORT: 3000
      MCP_HOST: 0.0.0.0
    depends_on:
      wp-init:
        condition: service_completed_successfully

  php:
    build:
      context: ./packages/wordpress-plugin
      dockerfile: Dockerfile
    image: jooservices/wordpress-mcp-plugin:php83
    working_dir: /app/packages/wordpress-plugin
    volumes:
      - .:/app
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    tty: true

  node:
    image: node:24-bookworm-slim
    working_dir: /app/packages/mcp-server
    volumes:
      - .:/app
      - mcp-node-modules:/app/packages/mcp-server/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm ci"
    profiles: ["ci"]

  integration:
    image: node:24-bookworm-slim
    working_dir: /app/packages/mcp-server
    volumes:
      - .:/app
    environment:
      RUN_INTEGRATION: "1"
      WORDPRESS_URL: http://wordpress
      WORDPRESS_CONNECTION_TOKEN: ${WORDPRESS_CONNECTION_TOKEN:-dev-wp-token-local-only}
      MCP_URL: http://mcp:3000
      MCP_AUTH_SECRET: ${MCP_AUTH_SECRET:-dev-mcp-secret-local-only}
    command: sh -c "npm ci && npm test -- tests/integration.test.ts"
    depends_on:
      mcp:
        condition: service_started
    profiles: ["integration"]

  e2e:
    image: node:24-bookworm-slim
    working_dir: /app/packages/mcp-server
    volumes:
      - .:/app
      - mcp-node-modules:/app/packages/mcp-server/node_modules
    environment:
      RUN_E2E: "1"
      RUN_E2E_FULL: ${RUN_E2E_FULL:-}
      MCP_URL: http://mcp:3000
      MCP_AUTH_SECRET: ${MCP_AUTH_SECRET:-dev-mcp-secret-local-only}
      WORDPRESS_SITE_ID: ${WORDPRESS_SITE_ID:-default}
      NODE_OPTIONS: --max-old-space-size=512
    command: sh -c "if [ ! -x node_modules/.bin/vitest ]; then npm ci; fi && npm test -- tests/e2e --fileParallelism=false"
    depends_on:
      mcp:
        condition: service_started
    profiles: ["e2e"]

volumes:
  db-data:
  wordpress-data:
  mcp-node-modules:
