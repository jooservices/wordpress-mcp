services:
  db:
    image: mariadb:11.4.13
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
    volumes:
      - wordpress-data:/var/www/html
      - ./packages/wordpress-plugin:/var/www/html/wp-content/plugins/wordpress-chatgpt
    depends_on:
      db:
        condition: service_healthy

  wp-init:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WP_DEV_TOKEN: ${WORDPRESS_CONNECTION_TOKEN:-dev-wp-token-local-only}
    volumes:
      - wordpress-data:/var/www/html
      - ./packages/wordpress-plugin:/var/www/html/wp-content/plugins/wordpress-chatgpt
      - ./docker/wordpress/init:/init:ro
    entrypoint: ["/bin/sh", "/init/setup.sh"]
    depends_on:
      - wordpress
    restart: "no"

  mcp:
    build:
      context: ./packages/mcp-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      WORDPRESS_URL: http://wordpress
      WORDPRESS_CONNECTION_TOKEN: ${WORDPRESS_CONNECTION_TOKEN:-dev-wp-token-local-only}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-static}
      MCP_AUTH_SECRET: ${MCP_AUTH_SECRET:-dev-mcp-secret-local-only}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:3000}
      MCP_PORT: 3000
      MCP_HOST: 0.0.0.0
    depends_on:
      wp-init:
        condition: service_completed_successfully

  php:
    build:
      context: ./packages/wordpress-plugin
      dockerfile: Dockerfile
    image: jooservices/wordpress-mcp-plugin:php83
    working_dir: /app
    volumes:
      - ./packages/wordpress-plugin:/app
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    tty: true

  node:
    image: node:22-bookworm-slim
    working_dir: /app/packages/mcp-server
    volumes:
      - .:/app
      - mcp-node-modules:/app/packages/mcp-server/node_modules
    command: sh -c "corepack enable && pnpm install && pnpm ci"
    profiles: ["ci"]

  integration:
    image: node:22-bookworm-slim
    working_dir: /app/packages/mcp-server
    volumes:
      - .:/app
    environment:
      RUN_INTEGRATION: "1"
      WORDPRESS_URL: http://wordpress
      WORDPRESS_CONNECTION_TOKEN: ${WORDPRESS_CONNECTION_TOKEN:-dev-wp-token-local-only}
      MCP_URL: http://mcp:3000
      MCP_AUTH_SECRET: ${MCP_AUTH_SECRET:-dev-mcp-secret-local-only}
    command: sh -c "npm install && npm test"
    depends_on:
      mcp:
        condition: service_started
    profiles: ["integration"]

volumes:
  db-data:
  wordpress-data:
  mcp-node-modules:
