name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Docker WordPress + MCP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Full E2E
        run: make e2e-full

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=120 wordpress mcp wp-init
